[project]
name = "nn-project"
version = "0.1.0"
description = "TabM vs CatBoost comparison for 30-day diabetes readmission prediction."
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy==2.3.5",
    "pandas==3.0.1",
    "scipy==1.16.3",
    "scikit-learn==1.8.0",
    "matplotlib==3.10.9",
    "seaborn==0.13.2",
    "jupyterlab==4.2.5",
    "notebook==7.2.2",
    "ipykernel==6.29.5",
    "tqdm==4.66.5",
    "catboost==1.2.10",
    "torch==2.11.0+cu128; sys_platform != 'darwin'",
    "torch>=2.4.0; sys_platform == 'darwin'",
    "rtdl-revisiting-models==0.0.2",
    "tabm==0.0.3",
    "pyarrow>=24.0.0",
    "imbalanced-learn>=0.14.1",
    "shap>=0.51.0",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
    { index = "pytorch-cu128", marker = "sys_platform != 'darwin'" },
]
